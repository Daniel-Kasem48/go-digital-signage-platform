version: "2"
sql:
  - engine: "postgresql"
    queries:  
      - "./internal/db/queries/tenant.sql"
      -  "./internal/db/queries/device.sql"
      -   "./internal/db/queries/auth-challenge.sql"
      -    "./internal/db/queries/content.sql"
      -    "./internal/db/queries/layout.sql"
      -    "./internal/db/queries/template.sql"
      -    "./internal/db/queries/channel.sql"
      -    "./internal/db/queries/playlist-item.sql"
      -    "./internal/db/queries/playlist.sql"
      -    "./internal/db/queries/device-group.sql"
      -    "./internal/db/queries/channel-schedule.sql"
      -    "./internal/db/queries/user.sql"
      -    "./internal/db/queries/refresh-token.sql"
    schema: "./schema/migrations"
    gen:
      go:
        package: "models"
        out: "internal/db/autogenerated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: false